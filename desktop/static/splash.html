<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Startbildschirm: lokal, ohne fremde Inhalte -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
    <title>MixMarket</title>
    <style>
      /* Farben aus der Oberfläche von MixMarket (web/src/styles/theme.css), hell und dunkel nach Systemeinstellung */
      :root {
        --bg: #dfddd7;
        --surface: #e9e7e1;
        --text: #1a1a18;
        --text-dim: #72726a;
        --border: rgba(26, 26, 24, 0.17);
        --danger: #b3261e;
        --btn: #1a1a18;
        --btn-text: #e9e7e1;
        --transition-fast: 150ms ease;
        --transition-normal: 250ms ease;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18191b;
          --surface: #1f2023;
          --text: #e9e9e6;
          --text-dim: #a3a39e;
          --border: rgba(255, 255, 255, 0.12);
          --danger: #ff8a80;
          --btn: #e9e9e6;
          --btn-text: #18191b;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
        font-size: 14px;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Ganze Fläche zum Verschieben des rahmenlosen Fensters, Knöpfe und Text ausgenommen */
      body {
        -webkit-app-region: drag;
        display: flex;
        flex-direction: column;
      }
      button,
      pre {
        -webkit-app-region: no-drag;
      }
      .start {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        transition: opacity var(--transition-normal);
      }
      .mark {
        width: 64px;
        height: 64px;
        color: var(--text);
      }
      .mark circle:last-child {
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 0.8;
        }
      }
      .word {
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .step {
        color: var(--text-dim);
        min-height: 20px;
        transition: opacity var(--transition-fast);
      }
      .bar {
        width: 180px;
        height: 3px;
        border-radius: 2px;
        background: var(--border);
        overflow: hidden;
      }
      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        background: var(--text);
        border-radius: 2px;
        animation: slide 1.3s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      /* Fehleranzeige */
      .error {
        display: none;
        flex: 1;
        flex-direction: column;
        gap: 12px;
        padding: 28px 28px 22px;
        min-height: 0;
      }
      body.has-error .start {
        display: none;
      }
      body.has-error .error {
        display: flex;
      }
      .error h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
        color: var(--danger);
      }
      .error p {
        margin: 0;
        color: var(--text-dim);
        line-height: 1.5;
      }
      .error pre {
        flex: 1;
        min-height: 0;
        margin: 0;
        padding: 12px;
        overflow: auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        -webkit-user-select: text;
        user-select: text;
      }
      .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }
      button {
        height: 34px;
        padding: 0 14px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font: inherit;
        font-weight: 550;
        white-space: nowrap;
        cursor: pointer;
        transition: background var(--transition-fast), opacity var(--transition-fast);
      }
      button:hover {
        background: var(--surface);
      }
      button.primary {
        background: var(--btn);
        color: var(--btn-text);
        border-color: var(--btn);
      }
      button.primary:hover {
        opacity: 0.88;
      }
    </style>
  </head>
  <body>
    <div class="start">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="13" cy="16" r="7" fill="none" stroke="currentColor" stroke-width="1.7" opacity="0.95" />
        <circle cx="19" cy="16" r="7" fill="none" stroke="currentColor" stroke-width="1.7" opacity="0.55" />
      </svg>
      <div class="word">MixMarket</div>
      <div class="bar"><span></span></div>
      <div class="step" id="step"></div>
    </div>
    <div class="error">
      <h1 id="error-title"></h1>
      <p id="error-hint"></p>
      <pre id="error-detail"></pre>
      <div class="actions">
        <button id="open-data"></button>
        <button id="open-log"></button>
        <button id="quit"></button>
        <button id="retry" class="primary"></button>
      </div>
    </div>
    <script>
      // Zustand vom Programm übernehmen: Schritt beim Start oder Fehler mit vollständiger Meldung
      const steps = { prepare: 'stepPrepare', database: 'stepDatabase', server: 'stepServer' }
      const byId = (id) => document.getElementById(id)
      window.mixmarketSplash.onState((state) => {
        const t = state.texts
        document.documentElement.lang = state.language
        byId('open-data').textContent = t.openDataFolder
        byId('open-log').textContent = t.openLog
        byId('quit').textContent = t.quit
        byId('retry').textContent = t.retry
        if (state.error) {
          document.body.classList.add('has-error')
          byId('error-title').textContent = state.error.title
          byId('error-hint').textContent = t.errorHint
          byId('error-detail').textContent = state.error.detail
        } else {
          document.body.classList.remove('has-error')
          byId('step').textContent = t[steps[state.step]] ?? t.starting
        }
      })
      byId('open-data').addEventListener('click', () => window.mixmarketSplash.openDataFolder())
      byId('open-log').addEventListener('click', () => window.mixmarketSplash.openLog())
      byId('quit').addEventListener('click', () => window.mixmarketSplash.quit())
      byId('retry').addEventListener('click', () => window.mixmarketSplash.retry())
    </script>
  </body>
</html>
